# Local fixes for background wait animation and working footers with mode badges.
id = "copilot"
version = "2026.08.29.1"
min_engine_version = 1
updated_at = "2026-08-29T00:00:00Z"
aliases = ["github-copilot", "ghcs"]

[[rules]]
id = "selection_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
all = [
  { any = [
    { contains = ["esc to cancel"] },
    { contains = ["esc cancel"] },
  ] },
  { any = [
    { contains = ["enter to select"] },
    { contains = ["enter to confirm"] },
    { contains = ["enter to submit"] },
    { contains = ["enter accept"] },
  ] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 110
region = "bottom_non_empty_lines(6)"
visible_working = true
# All four animation frames mean background agents are still running.
line_regex = ['^\s*(?:(?:Autopilot|Interactive|Plan|Allow All)\s+\x{00b7}\s+)*[\x{25cb}\x{25ce}\x{25c9}\x{25cf}]\s+Waiting for background agents(?:\s|\x{00b7}|$)']

[[rules]]
id = "working_interrupt_footer"
state = "working"
priority = 100
region = "bottom_non_empty_lines(6)"
visible_working = true
line_regex = ['^\s*(?:(?:Autopilot|Interactive|Plan|Allow All)\s+\x{00b7}\s+)*[\x{25cb}\x{25ce}\x{25c9}\x{25cf}]\s+.+\bctrl\+c interrupt(?:\s|$)']

[[rules]]
id = "working_cancel_hint"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
any = [
  { contains = ["esc to cancel"] },
  { contains = ["esc cancel"] },
  { contains = ["esc again to cancel"] },
  { contains = ["esc interrupt"] }
]
