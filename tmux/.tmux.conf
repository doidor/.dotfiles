setw -g mouse on
setw -g mode-keys vi
set -g set-clipboard external
set -g allow-passthrough on
set -g history-limit 10000
set -g base-index 1
set-option -g default-shell /bin/zsh
set-window-option -g xterm-keys on
set-window-option -g window-active-style bg=terminal

set display-panes-colour "pink"
set display-panes-active-colour "green"

set -g renumber-windows on

# vim-like pane resizing
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# and now unbind keys
unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right

# Set new panes to open in current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf

# Fuzzy window finder, grouped by session
bind w display-popup -E -w 90% -h 80% ~/.config/tmux/scripts/window-finder
# Jump straight back to the previous window, even across sessions
bind C-w run-shell "~/.config/tmux/scripts/window-finder toggle '#{window_id}' '#{client_name}'"
set-hook -g 'session-window-changed[100]' 'run-shell "~/.config/tmux/scripts/window-finder record #{window_id}"'
set-hook -g 'client-session-changed[100]' 'run-shell "~/.config/tmux/scripts/window-finder record #{window_id}"'

# Fuzzy agent-session finder, mirroring the window finder above
bind O display-popup -E -w 90% -h 80% ~/.config/tmux/scripts/agent-finder
# A Copilot session per window, so a window is always exactly one session.
# Run it through an interactive shell: tmux replaces PATH globally below, and
# a key binding is executed by the server with that reduced PATH, which does
# not include agency. Sourcing .zshrc gives the command the PATH it expects.
bind A new-window -c "#{pane_current_path}" "exec zsh -ic 'agency copilot --yolo'"
# The full ccmux TUI, for approvals, worktrees and diff review
bind C-o display-popup -E -w 85% -h 80% "ccmux"

set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Status bar, hand rolled rather than themed by a plugin. Powerline segments in
# the Nord palette, matching the reference screenshot.
#
# Every theme plugin tried here (Nord, Rosé Pine, Tokyo Night) drew its icons
# from the Nerd Fonts supplementary plane, U+F0000 and up. tmux carries those
# codepoints through intact, verified by round-tripping them with capture-pane,
# but this WezTerm build renders them as empty boxes while BMP characters in the
# same string render fine. The dividers below are U+E0B0 to U+E0B3, which sit in
# the BMP and which WezTerm draws from its own built-in glyphs rather than the
# configured font, so they render whatever the font does or does not carry.
#
# Palette: #2e3440 darkest, #3b4252 bar, #434c5e window, #4c566a session,
# #7b88a1 dim, #d8dee9 text, #eceff4 bright, #88c0d0 accent.
#
# Each segment is wedged on both sides: it opens with a divider drawn in the bar
# colour over the segment colour, and closes with the reverse. That keeps the
# arrows pointing the same way regardless of which window is active, which a
# segment cannot otherwise know.

set -g status-position bottom
set -g status-interval 5
set -g status-justify left

set -g status-style "bg=#3b4252,fg=#d8dee9"

set -g status-left-length 60
set -g status-right-length 160

# Session name, turning amber while the prefix is held.
set -g status-left "#[fg=#eceff4,bg=#{?client_prefix,#ebcb8b,#4c566a},bold] #S #[fg=#{?client_prefix,#ebcb8b,#4c566a},bg=#3b4252,nobold]"

set -g window-status-separator ""
set -g window-status-format "#[fg=#3b4252,bg=#434c5e]#[fg=#d8dee9,bg=#434c5e] #I #[fg=#7b88a1]#[fg=#d8dee9] #W#{?window_flags, #{window_flags},} #[fg=#434c5e,bg=#3b4252]"
set -g window-status-current-format "#[fg=#3b4252,bg=#88c0d0]#[fg=#2e3440,bg=#88c0d0,bold] #I #[fg=#2e3440,nobold]#[fg=#2e3440,bold] #W#{?window_flags, #{window_flags},} #[fg=#88c0d0,bg=#3b4252,nobold]"
# Windows with unseen output, so background agents are visible at a glance.
set -g window-status-activity-style "fg=#ebcb8b,bg=#434c5e"
set -g window-status-bell-style "fg=#bf616a,bg=#434c5e,bold"
set -g monitor-activity on
set -g activity-action none

# Branch, date, time, host. The branch lookup lives in
# ~/.config/tmux/scripts/status-git so it can be tested and shellchecked, and it
# prints nothing outside a work tree, which collapses the segment.
set -g status-right "#[fg=#a3be8c,bg=#3b4252] #(~/.config/tmux/scripts/status-git '#{pane_current_path}') #[fg=#7b88a1]#[fg=#d8dee9] %Y-%m-%d #[fg=#7b88a1]#[fg=#d8dee9] %H:%M #[fg=#88c0d0,bg=#3b4252]#[fg=#2e3440,bg=#88c0d0,bold] #h "

# Panes and messages, so nothing is left on tmux's green-on-black defaults.
set -g pane-border-style "fg=#434c5e"
set -g pane-active-border-style "fg=#88c0d0"
set -g message-style "bg=#4c566a,fg=#eceff4"
set -g mode-style "bg=#4c566a,fg=#eceff4"

# Set 256 colors
set -s default-terminal 'tmux-256color'
# WezTerm is truecolor, but nothing advertised RGB to tmux, so 24-bit colours
# were being quantised down to the 256 palette and themes rendered off. This
# also overrides the `-T 256` that wezterm/.wezterm.lua passes on startup.
set -as terminal-features ',*:RGB'

# for neovim
set -g @resurrect-strategy-nvim 'session'

# PATH with multiple Homebrew locations for portability (macOS Apple Silicon, Intel, Linux)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/home/linuxbrew/.linuxbrew/bin:/bin:/usr/bin"

# Copilot draws images with the kitty graphics protocol, which tmux does not
# implement: allow-passthrough lets the bytes reach WezTerm, but tmux knows no
# image is there and cannot move or clear it on scroll, split or redraw
# (tmux/tmux#4902). Sixel is the exception, since this tmux is built with
# --enable-sixel, so `chafa -f sixel` does display correctly in a pane.
set-environment -g COPILOT_INLINE_IMAGES_TMUX "0"

set -g @plugin 'tmux-plugins/tpm'

run -b '~/.tmux/plugins/tpm/tpm'
